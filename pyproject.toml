[project]
name = "homework"
version = "0.1.0"
description = "Otus HW 2. Static Typization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mypy>=1.19.1",
    "ruff>=0.15.6",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[toll.ruff.lint]
# E, W — Flake8 (ошибки и предупреждения)
# F — Pyflakes
# I — Isort (сортировка импортов)
# B — Flake8-bugbear (поиск вероятных багов)
# C4 — Flake8-comprehensions
select = ["E", "W", "F", "I", "B", "C4"]
ignore = []

[toll.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = 3.12
strict = true
warn_unused_configs = true
ignore_missing_imports = true
show_error_codes = true
